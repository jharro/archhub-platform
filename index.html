<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchHub | Control de Obras y Proyectos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen">

    <div id="auth-container" class="max-w-md mx-auto pt-24 px-4">
        <div class="bg-gray-900 border border-gray-800 p-8 rounded-2xl shadow-xl">
            <h1 class="text-3xl font-extrabold text-cyan-400 mb-2 tracking-tight">ARCHHUB</h1>
            <p class="text-gray-400 text-sm mb-6" id="auth-subtitle">Ingresa a tu cuenta de control de obras</p>
            
            <form id="auth-form" class="space-y-4">
                <div id="register-fields" class="hidden space-y-4">
                    <div>
                        <label class="block text-xs font-mono uppercase text-gray-400 mb-1">Nombre de la Empresa / Arquitecto</label>
                        <input type="text" id="auth-empresa" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="block text-xs font-mono uppercase text-gray-400 mb-1">Código Identificador de Cliente (Ej: CLT-001 o ADMIN)</label>
                        <input type="text" id="auth-codigo-cliente" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500" placeholder="Usa ADMIN para control global">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-mono uppercase text-gray-400 mb-1">Correo Electrónico</label>
                    <input type="email" id="auth-email" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs font-mono uppercase text-gray-400 mb-1">Contraseña</label>
                    <input type="password" id="auth-password" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500">
                </div>
                <button type="submit" id="btn-auth-submit" class="w-full bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold py-3 rounded-xl transition-all text-sm mt-2 shadow-lg shadow-cyan-500/20">
                    Iniciar Sesión
                </button>
            </form>
            
            <div class="mt-6 pt-4 border-t border-gray-800 text-center text-xs text-gray-400">
                <span id="toggle-auth-msg">¿No tienes cuenta?</span>
                <button id="btn-toggle-auth" class="text-cyan-400 font-semibold hover:underline ml-1">Regístrate de cero</button>
            </div>
        </div>
    </div>

    <div id="dashboard-container" class="hidden max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <header class="flex justify-between items-center mb-10 border-b border-gray-900 pb-5">
            <div>
                <span class="text-xs font-mono bg-cyan-500/10 border border-cyan-500/20 px-3 py-1 rounded-full text-cyan-400 uppercase font-bold tracking-wider" id="user-badge-role">Cargando...</span>
                <h1 class="text-3xl font-black text-white mt-2" id="user-welcome">Panel de Control</h1>
            </div>
            <button id="btn-logout" class="bg-gray-900 border border-gray-800 hover:border-red-500/30 text-gray-400 hover:text-red-400 text-xs font-mono py-2 px-4 rounded-xl transition-all">
                Cerrar Sesión
            </button>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-4">
                <h2 class="text-lg font-bold tracking-tight text-gray-300 border-l-2 border-cyan-500 pl-2">Proyectos Disponibles</h2>
                <div id="proyectos-list" class="space-y-3"></div>
            </div>
            
            <div class="lg:col-span-2 bg-gray-900/40 border border-gray-900 p-6 rounded-2xl h-fit">
                <h2 class="text-lg font-bold tracking-tight text-gray-300 mb-4 border-l-2 border-emerald-500 pl-2">Inventario en Obra e Insumos</h2>
                <div id="inventario-fallback" class="text-sm text-gray-500 py-10 text-center font-mono">
                    Selecciona un proyecto de la lista para auditar sus materiales.
                </div>
                <div id="inventario-table-wrapper" class="hidden overflow-x-auto">
                    <table class="w-full text-left text-sm text-gray-400">
                        <thead class="text-xs font-mono uppercase bg-gray-950 text-gray-400">
                            <tr>
                                <th class="p-3">Código</th>
                                <th class="p-3">Insumo</th>
                                <th class="p-3">Unidad</th>
                                <th class="p-3 text-right">Requerido</th>
                                <th class="p-3 text-right">En Obra</th>
                                <th class="p-3 text-center">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="inventario-rows" class="divide-y divide-gray-900"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        // =========================================================================
        // 1. CONFIGURACIÓN GLOBAL DE CREDENCIALES
        // =========================================================================
        const SUPABASE_URL = "https://ckkrsiynthxpgtzhxtpxi.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNra3JzaXludHhwZ3R6aHh0cHhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MDc5ODIsImV4cCI6MjA5NjA4Mzk4Mn0.csPIDvwyEp-cL-3JdNLkM6dH2OCTXl6abIvmJduMC10";

        // Inicialización segura usando el objeto global inyectado por el UMD bundle
        const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        if (!supabase) {
            alert("Error crítico: No se pudo cargar el SDK de Supabase desde la red.");
        }

        // Estado Global de la Aplicación
        let isLoginMode = true;
        let perfilUsuario = null;

        // Mapeo de Elementos de la Interfaz (DOM)
        const authContainer = document.getElementById('auth-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const authForm = document.getElementById('auth-form');
        const registerFields = document.getElementById('register-fields');
        const btnAuthSubmit = document.getElementById('btn-auth-submit');
        const btnToggleAuth = document.getElementById('btn-toggle-auth');
        const toggleAuthMsg = document.getElementById('toggle-auth-msg');
        const authSubtitle = document.getElementById('auth-subtitle');

        // Función Verificadora de Sesión Inicial al Cargar la Página
        async function initApp() {
            if (!supabase) return;
            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                if (error) throw error;
                if (session) {
                    await cargarDashboard(session.user);
                }
            } catch (err) {
                console.error("Error comprobando estado de sesión activa:", err.message);
            }
        }

        // Intercambiador de Vistas Visuales (Login / Registro de Cero)
        btnToggleAuth.addEventListener('click', (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            
            if(isLoginMode) {
                registerFields.classList.add('hidden');
                authSubtitle.innerText = "Ingresa a tu cuenta de control de obras";
                btnAuthSubmit.innerText = "Iniciar Sesión";
                toggleAuthMsg.innerText = "¿No tienes cuenta?";
                btnToggleAuth.innerText = "Regístrate de cero";
            } else {
                registerFields.classList.remove('hidden');
                authSubtitle.innerText = "Crea un nuevo perfil corporativo en el sistema";
                btnAuthSubmit.innerText = "Crear Cuenta Privada";
                toggleAuthMsg.innerText = "¿Ya eres miembro?";
                btnToggleAuth.innerText = "Inicia sesión";
            }
        });

        // Manejador del Envío del Formulario (Submit) con Captura de Errores Activa
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!supabase) return;

            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            try {
                if (isLoginMode) {
                    // FLUJO DE INICIO DE SESIÓN
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    if (data.user) {
                        await cargarDashboard(data.user);
                    }
                } else {
                    // FLUJO DE REGISTRO DESDE CERO
                    const empresa = document.getElementById('auth-empresa').value;
                    const codigoCliente = document.getElementById('auth-codigo-cliente').value.toUpperCase();
                    const rol = codigoCliente === 'ADMIN' ? 'admin' : 'cliente';

                    const { data, error } = await supabase.auth.signUp({ email, password });
                    if (error) throw error;

                    if (data.user) {
                        // Inserción inmediata del perfil relacional complementario
                        const { error: profileError } = await supabase.from('perfiles').insert([
                            { id: data.user.id, id_cliente: codigoCliente, nombre_empresa: empresa, rol: rol }
                        ]);
                        
                        if (profileError) throw profileError;
                        
                        alert("Registro corporativo exitoso en la nube. Accediendo...");
                        await cargarDashboard(data.user);
                    }
                }
            } catch (err) {
                alert("Error en la operación de acceso: " + err.message);
                console.error(err);
            }
        });

        // Orquestador de Carga del Tablero Principal (Dashboard)
        async function cargarDashboard(user) {
            if (!supabase) return;
            try {
                authContainer.classList.add('hidden');
                dashboardContainer.classList.remove('hidden');

                // 1. Obtención del perfil extendido del usuario logueado
                const { data: perfil, error } = await supabase.from('perfiles').select('*').eq('id', user.id).single();
                if (error || !perfil) {
                    alert("Aviso: Autenticado correctamente, pero no se detectó un perfil asignado en la tabla 'perfiles' de la Base de Datos para este usuario.");
                    authContainer.classList.remove('hidden');
                    dashboardContainer.classList.add('hidden');
                    return;
                }
                perfilUsuario = perfil;

                // Renderizar componentes de identidad en la cabecera
                document.getElementById('user-welcome').innerText = `Hola, ${perfil.nombre_empresa}`;
                const badge = document.getElementById('user-badge-role');
                badge.innerText = perfil.rol === 'admin' ? 'Arquitecto Administrador' : `Cliente: ${perfil.id_cliente}`;
                
                // 2. Extraer Proyectos (Filtrados automáticamente en tiempo real por las políticas RLS de Postgres)
                const { data: proyectos, error: prjError } = await supabase.from('proyectos').select('*');
                if (prjError) throw prjError;

                const listContainer = document.getElementById('proyectos-list');
                listContainer.innerHTML = '';
                
                if (proyectos.length === 0) {
                    listContainer.innerHTML = '<p class="text-xs font-mono text-gray-500">Ningún proyecto asignado a este código de cliente actualmente.</p>';
                    return;
                }

                // Construir tarjetas interactivas de proyectos
                proyectos.forEach(p => {
                    const card = document.createElement('div');
                    card.className = "bg-gray-900 border border-gray-800 hover:border-cyan-500/40 p-4 rounded-xl cursor-pointer transition-all";
                    card.innerHTML = `
                        <h3 class="font-bold text-white text-base">${p.nombre_proyecto}</h3>
                        <p class="text-xs text-gray-400 mb-2">${p.ubicacion || 'Sin ubicación'}</p>
                        <div class="w-full bg-gray-950 h-1.5 rounded-full overflow-hidden mb-2">
                            <div class="bg-cyan-500 h-full" style="width: ${(p.avance_fisico * 100)}%"></div>
                        </div>
                        <div class="flex justify-between text-[10px] font-mono text-gray-500">
                            <span>Fase: ${p.fase_actual || 0}</span>
                            <span>Progreso: ${(p.avance_fisico * 100).toFixed(0)}%</span>
                        </div>
                    `;
                    card.addEventListener('click', () => consultarInventario(p.id_proyecto));
                    listContainer.appendChild(card);
                });
            } catch (err) {
                alert("Error al cargar la información del panel: " + err.message);
                console.error(err);
            }
        }

        // Consultor del Inventario de Materiales por Obra Seleccionada
        async function consultarInventario(idProyecto) {
            if (!supabase) return;
            try {
                document.getElementById('inventario-fallback').classList.add('hidden');
                const wrapper = document.getElementById('inventario-table-wrapper');
                const rowsContainer = document.getElementById('inventario-rows');
                
                rowsContainer.innerHTML = '<tr><td colspan="6" class="text-center py-4 font-mono text-xs">Buscando insumos...</td></tr>';
                wrapper.classList.remove('hidden');

                const { data: items, error } = await supabase.from('inventarios').select('*').eq('id_proyecto', idProyecto);
                rowsContainer.innerHTML = '';

                if (error) throw error;

                if (!items || items.length === 0) {
                    rowsContainer.innerHTML = '<tr><td colspan="6" class="text-center py-4 font-mono text-xs text-gray-500">No hay existencias registradas para esta obra.</td></tr>';
                    return;
                }

                // Construir las filas dinámicas de la tabla de materiales
                items.forEach(item => {
                    const badgeColor = item.estado === 'PEDIDO URGENTE' ? 'bg-red-500/10 text-red-400 border-red-500/20' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                    const row = document.createElement('tr');
                    row.className = "hover:bg-gray-900/50 transition-colors";
                    row.innerHTML = `
                        <td class="p-3 font-mono text-xs text-cyan-400">${item.codigo}</td>
                        <td class="p-3 font-semibold text-white">${item.insumo}</td>
                        <td class="p-3 text-xs">${item.unidad}</td>
                        <td class="p-3 text-right font-mono">${item.requerido}</td>
                        <td class="p-3 text-right font-mono text-white">${item.en_obra}</td>
                        <td class="p-3 text-center">
                            <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold border ${badgeColor}">${item.estado}</span>
                        </td>
                    `;
                    rowsContainer.appendChild(row);
                });
            } catch (err) {
                alert("Error al consultar el inventario físico: " + err.message);
                console.error(err);
            }
        }

        // Manejador del Botón de Cierre de Sesión Seguro
        document.getElementById('btn-logout').addEventListener('click', async () => {
            if (!supabase) return;
            await supabase.auth.signOut();
            window.location.reload();
        });

        // Hook de arranque de la aplicación web
        window.onload = initApp;
    </script>
</body>
</html>
