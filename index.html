<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ArchHub | Debug Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-white p-10">

    <div id="debug-log" class="font-mono text-xs text-yellow-500 mb-5"></div>

    <div id="main-content">
        <h1>Cargando ArchHub...</h1>
    </div>

    <script>
        const log = (msg) => {
            document.getElementById('debug-log').innerHTML += `<p>> ${msg}</p>`;
            console.log(msg);
        };

        try {
            log("Iniciando carga de Supabase...");
            
            const SUPABASE_URL = "https://ckkrsiynthxpgtzhxtpxi.supabase.co"; 
            const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNra3JzaXludHhwZ3R6aHh0cHhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MDc5ODIsImV4cCI6MjA5NjA4Mzk4Mn0.csPIDvwyEp-cL-3JdNLkM6dH2OCTXl6abIvmJduMC10";

            if (!window.supabase) {
                throw new Error("El SDK de Supabase no cargó. Verifica tu conexión a internet.");
            }

            const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            log("Cliente creado exitosamente.");

            // Prueba de conexión real
            db.from('perfiles').select('count', { count: 'exact', head: true })
            .then(({ count, error }) => {
                if (error) log("Error de API: " + error.message);
                else log("Conexión a base de datos exitosa. Tablas detectadas: " + count);
            });

        } catch (e) {
            log("CRITICAL ERROR: " + e.message);
        }
    </script>
</body>
</html>
</html>
